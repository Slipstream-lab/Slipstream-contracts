[package]
name = "harness"
description = "Runs each naive/optimized pattern pair through slipstream-core and reports the contention delta."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "harness"
path = "src/lib.rs"

[[bin]]
name = "slipstream-harness"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
